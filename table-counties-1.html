<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { 
      margin: 0; 
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; 
      color: #222;
      background: transparent;
  }
  .wrapper { 
      overflow-x: auto; 
      width: 100%; 
      border: 1px solid #e5e5e5; 
      border-radius: 4px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      background: #ffffff;
  }
  table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
  }
  thead {
      background-color: #ffffff;
      border-bottom: 2px solid #e5e5e5;
  }
  th { 
      color: #111111; 
      padding: 12px 8px; 
      font-size: 12px;
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
  }
  td { 
      padding: 10px 8px; 
      border-bottom: 1px solid #e5e5e5; 
      color: #333333;
      vertical-align: middle;
  }
  tr:last-child td {
      border-bottom: none;
  }
  .team-cell { 
      text-align: left; 
      font-weight: 700; 
      color: #111111;
      display: flex;
      align-items: center;
      gap: 10px;
  }
  .badge {
      width: 24px;
      height: 24px;
      object-fit: contain;
  }
  tr.melksham { 
      background-color: #ffffff !important; 
      border-left: 4px solid #c30000; 
  }
  tr.melksham td { 
      font-weight: 800; 
  }
  tr.melksham .team-name {
      color: #c30000 !important;
  }
  .pts { 
      font-weight: 800; 
      color: #111111;
  }
</style>
</head>
<body>
<div class="wrapper">
  <table>
